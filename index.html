<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alexander Reevcrona</title>
<meta name="description" content="Alexander Reevcrona went from a warehouse floor to building data and AI for hockey clubs.">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav id="crumb" class="crumb" aria-label="Breadcrumb"></nav>
  <div class="hdr-r">
    <div id="seg" class="seg" role="group" aria-label="Story view" hidden>
      <button id="segScroll" aria-pressed="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="8" rx="2"/><rect x="5" y="14" width="14" height="7" rx="2"/></svg><span>Scroll</span></button>
      <button id="segTl" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Timeline</span></button>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="Switch to dark theme"></button>
  </div>
</header>
<main id="app">
  <section id="home" class="view">
    <div id="hero" class="hero"><img id="heroImg" alt=""></div>
    <!-- Landing copy (intro + "looking for" line) lives in the INTRO / LOOKING_FOR consts at the top of main.js -->
    <div id="body" class="body"></div>
  </section>
  <section id="flowView" class="view" hidden>
    <div id="flow" class="flow" tabindex="0" aria-label="Chapters"></div>
    <div id="dots" class="dots" aria-hidden="true"></div>
    <div id="tl" class="tl" hidden aria-label="Timeline overview"></div>
  </section>
</main>
<footer>
  <div class="left"><button class="pill" id="upBtn" title="Up one level (Esc)" hidden>↑ Up</button></div>
</footer>
<script src="main.js"></script>
</body>
</html>
